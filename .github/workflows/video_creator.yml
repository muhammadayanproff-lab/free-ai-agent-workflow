name: AI Product Promo Video Creator

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product name (the only required creative input)"
        required: true
        type: string
      product_notes:
        description: "Optional verified product details; leave blank if unknown"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: AI automatically creates the creative brief
        id: creative
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          PRODUCT_NOTES: ${{ inputs.product_notes }}
        run: python agents/video_campaign_brief.py

      - name: Generate promotional product image automatically
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_PROMPT: ${{ steps.creative.outputs.image_prompt }}
        run: python agents/images_creator.py

      - name: Create vertical promotional video automatically
        env:
          VIDEO_TITLE: ${{ steps.creative.outputs.video_title }}
          VIDEO_SUBTITLE: ${{ steps.creative.outputs.video_subtitle }}
          VIDEO_CTA: ${{ steps.creative.outputs.video_cta }}
          VIDEO_DURATION: "15"
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python agents/video_creator.py

      - name: Save video, public URL, source image and AI creative brief
        uses: actions/upload-artifact@v4
        with:
          name: product-promo-video
          path: |
            generated_videos/*.mp4
            generated_videos/video_url.txt
            generated_videos/title.txt
            generated_videos/subtitle.txt
            generated_videos/cta.txt
            generated_images/*
            creative_output/
          if-no-files-found: error
          retention-days: 14
