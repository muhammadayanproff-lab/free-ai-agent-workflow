name: AI Social Publisher Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What is this post about?"
        required: true
        type: string
      audience:
        description: "Who should see this post?"
        required: false
        default: "general audience"
        type: string
      caption:
        description: "Optional caption or brief (Agent 6 can draft one if blank)"
        required: false
        type: string
      platforms:
        description: "Choose the target platforms"
        required: true
        default: "Instagram,Facebook,TikTok"
        type: choice
        options:
          - "Instagram,Facebook,TikTok"
          - "Instagram,Facebook"
          - "Instagram,TikTok"
          - "Facebook,TikTok"
          - "Instagram"
          - "Facebook"
          - "TikTok"
      media_type:
        description: "Type of media supplied"
        required: true
        default: "image"
        type: choice
        options:
          - "image"
          - "video"
          - "none"
      media_url:
        description: "Optional public HTTPS media URL (not uploaded by this workflow)"
        required: false
        type: string
      approval:
        description: "Approval record only — this release is draft-only"
        required: true
        default: "DRAFT_ONLY"
        type: choice
        options:
          - "DRAFT_ONLY"
          - "REVIEWED_BY_HUMAN"

permissions:
  contents: read

jobs:
  prepare-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare platform-specific drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_TOPIC: ${{ inputs.topic }}
          POST_AUDIENCE: ${{ inputs.audience }}
          POST_CAPTION: ${{ inputs.caption }}
          TARGET_PLATFORMS: ${{ inputs.platforms }}
          MEDIA_TYPE: ${{ inputs.media_type }}
          MEDIA_URL: ${{ inputs.media_url }}
          PUBLISH_APPROVAL: ${{ inputs.approval }}
        run: python agents/publisher.py

      - name: Upload social drafts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-posts-for-review
          path: publisher_output/
          if-no-files-found: warn
          retention-days: 7
