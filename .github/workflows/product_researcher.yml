name: AI Product Opportunity Research Agent

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product name from Markaz or your own supplier"
        required: false
        type: string
      product_url:
        description: "Optional public HTTPS product page URL (no login required)"
        required: false
        type: string
      product_price:
        description: "Supplier price, if known (include PKR)"
        required: false
        type: string
      product_category:
        description: "Product category"
        required: false
        type: string
      product_notes:
        description: "Known features, supplier details, or questions to check"
        required: false
        type: string

permissions:
  contents: read

jobs:
  research-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Research product opportunity
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          PRODUCT_URL: ${{ inputs.product_url }}
          PRODUCT_PRICE: ${{ inputs.product_price }}
          PRODUCT_CATEGORY: ${{ inputs.product_category }}
          PRODUCT_NOTES: ${{ inputs.product_notes }}
        run: python agents/product_researcher.py

      - name: Upload product review for approval
        uses: actions/upload-artifact@v4
        with:
          name: product-opportunity-review
          path: product_research_output/
          if-no-files-found: error
          retention-days: 14
