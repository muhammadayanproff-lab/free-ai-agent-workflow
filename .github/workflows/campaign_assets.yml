name: Prepare Product Campaign Assets
on:
  workflow_dispatch:
    inputs:
      cod_confirmed:
        description: "Confirm you opened the recommended product from the latest report in Markaz Pakistan Shop and COD is available at checkout"
        required: true
        type: choice
        options: ["NO", "YES"]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: inputs.cod_confirmed == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download latest successful Pakistan Product Discovery result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow product_discovery.yml --status completed --limit 20 --json databaseId,conclusion --jq 'map(select(.conclusion == "success")) | .[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful Product Discovery run found. Run Product Discovery first."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name pakistan-product-discovery --dir product_discovery_output
          test -f product_discovery_output/selected_product.json
      - name: Verify selected Pakistan Shop listing and download original photos
        env:
          MARKAZ_COD_CONFIRMED: ${{ inputs.cod_confirmed }}
        run: python agents/prepare_product.py
      - name: Analyze Pakistan demand, competitors and creative examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
        run: python agents/market_analysis.py
      - name: Generate three AI campaign image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python agents/image_campaign_creator.py
      - name: Analyze original product photos and create one video prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-2.5-flash
          PRODUCT_IMAGES_DIR: source_product_images
        run: python agents/video_prompt_agent.py
      - name: Write SEO package and four separate captions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
        run: python agents/campaign_copywriter.py
      - name: Upload AI concepts and original product photo to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python agents/cloudinary_campaign_uploader.py
      - name: Build campaign review package
        run: |
          mkdir -p campaign_review
          cp -r source_product_images generated_images product_data market_analysis video_prompt_output campaign_copy campaign_review/
          cp campaign_media_urls.json campaign_review/
          {
            echo "# Click & Collect — Campaign Review"
            echo
            echo "Review original supplier photos against AI concepts. AI concepts can change product details."
            echo "The owner confirmed COD for the exact Pakistan Shop product; stock and price can change."
            echo
            echo "## Market analysis"
            cat market_analysis/market_analysis.md
            echo
            echo "## Single video prompt"
            cat video_prompt_output/image_analysis_and_video_prompt.md
            echo
            echo "## SEO and four separate captions"
            cat campaign_copy/campaign_copy.md
            echo
            echo "## Public image URLs and choices"
            cat campaign_media_urls.json
            echo
            echo "## Manual video step"
            echo "Copy video_prompt_output/video_prompt.txt into your chosen video generator. Upload the finished video using the upload page, then copy its public HTTPS URL into the publishing workflow."
          } > campaign_review/REVIEW.md
      - uses: actions/upload-artifact@v4
        with:
          name: click-collect-campaign-review
          path: campaign_review/
          if-no-files-found: error
          retention-days: 30
