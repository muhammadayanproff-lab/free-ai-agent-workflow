name: Prepare Product Campaign Assets
on:
  workflow_run:
    workflows: ["Pakistan Product Discovery"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download product discovery result from the triggering run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$DISCOVERY_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/product_discovery.yml/runs?status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No successful Product Discovery run found."
            exit 1
          fi
          echo "Downloading Product Discovery run: $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name pakistan-product-discovery --dir product_discovery_output
          test -f product_discovery_output/selected_product.json
      - name: Verify selected Pakistan Shop listing and download original photos
        run: python agents/prepare_product.py
      - name: Analyze Pakistan demand, competitors and creative examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
        run: python agents/market_analysis.py
      - name: Generate three AI campaign image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python agents/image_campaign_creator.py
      - name: Analyze original product photos and create one video prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-3.8-flash
          PRODUCT_IMAGES_DIR: source_product_images
        run: python agents/video_prompt_agent.py
      - name: Write SEO package and four separate captions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
        run: python agents/campaign_copywriter.py
      - name: Upload AI concepts and original product photo to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python agents/cloudinary_campaign_uploader.py
      - name: Build campaign review package
        run: |
          mkdir -p campaign_review
          cp -r source_product_images generated_images product_data market_analysis video_prompt_output campaign_copy campaign_review/
          cp campaign_media_urls.json campaign_review/
          {
            echo "# Click & Collect — Campaign Review"
            echo
            echo "Review original supplier photos against AI concepts. AI concepts can change product details."
            echo "COD and checkout availability are NOT verified from the public listing. Check current stock, final price and payment options before approving publication. Captions are instructed not to promise COD."
            echo
            echo "## Market analysis"
            cat market_analysis/market_analysis.md
            echo
            echo "## Single video prompt"
            cat video_prompt_output/image_analysis_and_video_prompt.md
            echo
            echo "## SEO and four separate captions"
            cat campaign_copy/campaign_copy.md
            echo
            echo "## Public image URLs and choices"
            cat campaign_media_urls.json
            echo
            echo "## Manual video step"
            echo "Copy video_prompt_output/video_prompt.txt into your chosen video generator. Upload the finished video at the Click & Collect upload page. The watcher checks Cloudinary every five minutes and creates your final approval issue automatically."
          } > campaign_review/REVIEW.md
      - uses: actions/upload-artifact@v4
        with:
          name: click-collect-campaign-review
          path: campaign_review/
          if-no-files-found: error
          retention-days: 30
      - name: Notify owner that the video prompt is ready
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_RUN_ID: \${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Video prompt ready: campaign run $GITHUB_RUN_ID"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json title --jq "map(select(.title == \\"$TITLE\\")) | length")
          if [ "$EXISTING" = "0" ]; then
            {
              echo "# Your product video prompt is ready"
              echo
              echo "Copy the prompt below into your video generator. When the video is ready, upload it here:"
              echo "https://muhammadayanproff-lab.github.io/free-ai-agent-workflow/upload-video.html"
              echo
              echo "## Video prompt"
              echo
              echo '~~~text'
              cat video_prompt_output/video_prompt.txt
              echo
              echo '~~~'
              echo
              echo "## Full campaign review"
              echo "Download the campaign artifact from https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo "After upload, Cloudinary is checked automatically and a separate final approval issue will be created."
            } > video_prompt_notice.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file video_prompt_notice.md
          else
            echo "Video prompt notification already exists for this campaign."
          fi
