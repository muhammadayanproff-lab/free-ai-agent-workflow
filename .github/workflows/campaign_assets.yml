name: Prepare Product Campaign Assets
on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Exact Markaz Pakistan Shop product URL from the discovery report"
        required: true
        type: string
      cod_confirmed:
        description: "Confirm you opened this exact product in Pakistan Shop and COD is available at checkout"
        required: true
        type: choice
        options: ["NO", "YES"]
      product_category:
        description: "Optional product category from the discovery report"
        required: false
        type: string
      product_price:
        description: "Optional current PKR price copied from the discovery report if page extraction is unavailable"
        required: false
        type: string
      product_title:
        description: "Optional exact title from the discovery report, used only if Markaz page fetch fails"
        required: false
        type: string
      product_image_url:
        description: "Optional main product image URL from the discovery report, used only if page fetch fails"
        required: false
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: inputs.cod_confirmed == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public Markaz Pakistan listing and download original photos
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          PRODUCT_CATEGORY: ${{ inputs.product_category }}
          PRODUCT_PRICE: ${{ inputs.product_price }}
          PRODUCT_TITLE: ${{ inputs.product_title }}
          PRODUCT_IMAGE_URL: ${{ inputs.product_image_url }}
          MARKAZ_COD_CONFIRMED: ${{ inputs.cod_confirmed }}
        run: python agents/prepare_product.py
      - name: Analyze Pakistan demand, competitor products and creative examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
        run: python agents/market_analysis.py
      - name: Generate three AI campaign image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python agents/image_campaign_creator.py
      - name: Analyze original product photos and create one video prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-2.5-flash
          PRODUCT_IMAGES_DIR: source_product_images
        run: python agents/video_prompt_agent.py
      - name: Write SEO package and four separate captions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
        run: python agents/campaign_copywriter.py
      - name: Upload AI concepts and original product photo to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python agents/cloudinary_campaign_uploader.py
      - name: Build approval package
        run: |
          mkdir -p campaign_review
          cp -r source_product_images generated_images product_data market_analysis video_prompt_output campaign_copy campaign_review/
          cp campaign_media_urls.json campaign_review/
          {
            echo "# Click & Collect — Campaign Review"
            echo
            echo "Check original supplier photos against all AI concepts. AI concepts can change product details."
            echo "The owner confirmed COD for this exact Pakistan Shop listing; stock and price can change."
            echo
            echo "## Market analysis"
            cat market_analysis/market_analysis.md
            echo
            echo "## Video prompt"
            cat video_prompt_output/image_analysis_and_video_prompt.md
            echo
            echo "## SEO and separate captions"
            cat campaign_copy/campaign_copy.md
            echo
            echo "## Public AI image URLs"
            cat campaign_media_urls.json
            echo
            echo "## Manual video step"
            echo "Copy video_prompt_output/video_prompt.txt into your chosen video generator. Upload the finished video through the upload page and copy its public HTTPS URL for the publishing workflow."
          } > campaign_review/REVIEW.md
      - uses: actions/upload-artifact@v4
        with:
          name: click-collect-campaign-review
          path: campaign_review/
          if-no-files-found: error
          retention-days: 30
