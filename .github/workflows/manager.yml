name: AI Manager Agent

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify GitHub CLI
        run: gh --version

      - name: Run Manager Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agents/manager.py

      - name: Upload Manager Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-report
          path: reports/manager_report_latest.md
          if-no-files-found: warn
          retention-days: 7
