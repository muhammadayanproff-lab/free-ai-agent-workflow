name: AI Trend Analyst

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

jobs:
  trend-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trend Analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NICHES: "AI technology, social media trends, content creation"
        run: python agents/trend_analyst.py

      - name: Save Trend Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-analysis-report
          path: reports/trend_analysis_latest.md
          if-no-files-found: warn
          retention-days: 7
