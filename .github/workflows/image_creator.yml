name: AI Image Creator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the image to generate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
        run: python agents/images_creator.py

      - name: Upload image to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python agents/cloudinary_uploader.py

      - name: Save generated image and public URL
        uses: actions/upload-artifact@v4
        with:
          name: ai-generated-image-and-url
          path: |
            generated_images/
            media_output/
          if-no-files-found: error
