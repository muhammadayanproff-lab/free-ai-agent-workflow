name: Pakistan Product Discovery
on:
  push:
    branches: [main]
    paths:
      - "agents/researcher.py"
      - ".github/workflows/product_discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
permissions:
  contents: read
jobs:
  schedule_guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - id: guard
        name: Run on alternate Pakistan calendar days at 2 PM
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          import os
          today = datetime.now(ZoneInfo("Asia/Karachi")).date()
          anchor = date(2026, 11, 26)
          days = (today - anchor).days
          should_run = days >= 0 and days % 2 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"Pakistan date: {today}; scheduled run: {should_run}")
          PY
  discover:
    needs: schedule_guard
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.schedule_guard.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research Pakistani market and crawl public Markaz Pakistan Shop products
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          MARKAZ_MAX_PAGES_PER_CATEGORY: "2"
        run: python agents/researcher.py
      - name: Save product shortlist, source links and selected product
        uses: actions/upload-artifact@v4
        with:
          name: pakistan-product-discovery
          path: product_discovery_output/
          if-no-files-found: error
          retention-days: 30
