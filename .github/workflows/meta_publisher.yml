name: Approved Image and Video Publishing

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Choose APPROVE only after checking the complete campaign"
        required: true
        type: choice
        options: [REJECT, APPROVE]
      platforms:
        description: "Publish both separate posts to"
        required: true
        default: "Instagram,Facebook"
        type: choice
        options: ["Instagram,Facebook", "Instagram", "Facebook"]
      image_url:
        description: "Public HTTPS URL of the approved campaign image"
        required: true
        type: string
      video_url:
        description: "Public HTTPS URL of your manually generated video (upload to Cloudinary first)"
        required: true
        type: string
      image_caption:
        description: "Final approved image-post caption"
        required: true
        type: string
      video_caption:
        description: "Final approved video/Reel caption"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: inputs.approval == 'APPROVE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish separate image and video posts with separate captions
        env:
          PUBLISH_APPROVAL: ${{ inputs.approval }}
          TARGET_PLATFORMS: ${{ inputs.platforms }}
          IMAGE_URL: ${{ inputs.image_url }}
          VIDEO_URL: ${{ inputs.video_url }}
          IMAGE_CAPTION: ${{ inputs.image_caption }}
          VIDEO_CAPTION: ${{ inputs.video_caption }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: python agents/meta_publisher.py
      - name: Save publishing receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meta-publishing-receipt
          path: publish_output/
          retention-days: 30
