name: Publish Approved Campaign to Instagram and Facebook
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  publish:
    if: "github.event.issue.pull_request == null && github.event.issue.state == 'open' && startsWith(github.event.issue.title, 'Campaign approval required: run ') && github.event.comment.body == 'APPROVE' && github.event.comment.user.login == github.repository_owner"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read campaign run and uploaded video from approval issue
        id: approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          export ISSUE_BODY
          python - <<'PY'
          import os
          import re
          body = os.environ["ISSUE_BODY"]
          run = re.search(r"<!-- campaign_run_id=(\d+) -->", body)
          video = re.search(r"<!-- video_url=(https://[^ ]+) -->", body)
          if not run or not video:
              raise SystemExit("Approval issue is missing a valid campaign run ID or HTTPS video URL.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"campaign_run_id={run.group(1)}\n")
              output.write(f"video_url={video.group(1)}\n")
          PY
      - name: Download exact campaign review artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAMPAIGN_RUN_ID: ${{ steps.approval.outputs.campaign_run_id }}
        run: |
          gh run download "$CAMPAIGN_RUN_ID" --repo "$GITHUB_REPOSITORY" --name click-collect-campaign-review --dir campaign_review
          test -f campaign_review/campaign_copy/campaign_copy.json
          test -f campaign_review/campaign_media_urls.json
      - name: Publish image and video as separate posts with four platform-specific captions
        env:
          PUBLISH_APPROVAL: APPROVE
          TARGET_PLATFORMS: Instagram,Facebook
          IMAGE_CHOICE: concept_1
          VIDEO_URL: ${{ steps.approval.outputs.video_url }}
          CAMPAIGN_REVIEW_DIR: campaign_review
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: python agents/meta_publisher.py
      - name: Save publishing receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meta-publishing-receipt
          path: publish_output/
          retention-days: 30
      - name: Confirm publication and close approval issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Published successfully. The publishing receipt is available in this workflow run's artifacts."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
