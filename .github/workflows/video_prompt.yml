name: Product Image Analysis and Video Prompt

on:
  workflow_dispatch:
    inputs:
      images_path:
        description: "Repository folder containing the original Markaz product images"
        required: true
        default: "source_product_images"
        type: string
      product_details:
        description: "Verified product details from the Markaz Pakistan listing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyze product images and write one 10–15 second video prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_IMAGES_DIR: ${{ inputs.images_path }}
          PRODUCT_DETAILS: ${{ inputs.product_details }}
        run: python agents/video_prompt_agent.py
      - name: Save image analysis and prompt
        uses: actions/upload-artifact@v4
        with:
          name: product-image-analysis-and-video-prompt
          path: video_prompt_output/
          if-no-files-found: error
          retention-days: 30
