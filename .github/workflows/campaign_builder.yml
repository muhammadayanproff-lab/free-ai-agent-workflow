name: Click and Collect — Complete Campaign Builder

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Product name copied from Markaz"
        required: true
        type: string
      product_url:
        description: "Optional public HTTPS product link"
        required: false
        type: string
      supplier_price:
        description: "Supplier price in PKR, if known"
        required: false
        type: string
      category:
        description: "Product category"
        required: false
        type: string
      verified_notes:
        description: "Supplier name, verified features, stock/return details, or questions"
        required: false
        type: string
      audience:
        description: "Target customer"
        required: false
        default: "Pakistan online shoppers"
        type: string
      platforms:
        description: "Platforms for draft captions"
        required: true
        default: "Instagram,Facebook,TikTok"
        type: choice
        options:
          - "Instagram,Facebook,TikTok"
          - "Instagram,Facebook"
          - "Instagram"
          - "Facebook"
          - "TikTok"
      image_prompt:
        description: "Optional image brief; leave blank for a product-based prompt"
        required: false
        type: string
      video_title:
        description: "Short video headline"
        required: true
        type: string
      video_subtitle:
        description: "Optional verified product benefit"
        required: false
        type: string
      video_cta:
        description: "Video call to action"
        required: false
        default: "Shop now"
        type: string
      duration:
        description: "Video length"
        required: true
        default: "15"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
          - "30"

permissions:
  contents: read

jobs:
  build-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build research, SEO, image, video and social drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          PRODUCT_URL: ${{ inputs.product_url }}
          PRODUCT_PRICE: ${{ inputs.supplier_price }}
          PRODUCT_CATEGORY: ${{ inputs.category }}
          PRODUCT_NOTES: ${{ inputs.verified_notes }}
          TARGET_AUDIENCE: ${{ inputs.audience }}
          TARGET_PLATFORMS: ${{ inputs.platforms }}
          IMAGE_PROMPT: ${{ inputs.image_prompt }}
          VIDEO_TITLE: ${{ inputs.video_title }}
          VIDEO_SUBTITLE: ${{ inputs.video_subtitle }}
          VIDEO_CTA: ${{ inputs.video_cta }}
          VIDEO_DURATION: ${{ inputs.duration }}
        run: python agents/campaign_builder.py

      - name: Upload complete campaign approval package
        uses: actions/upload-artifact@v4
        with:
          name: click-collect-campaign-approval
          path: campaign_package/
          if-no-files-found: error
          retention-days: 14
